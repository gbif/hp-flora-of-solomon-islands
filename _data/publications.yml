papers_title: Research articles
papers_intro: Peer-reviewed papers from the project. Each DOI opens the article on the journal's site.
papers:   # newest first
  - title: A revision of <i>Begonia</i> (Begoniaceae) in the Solomon Islands, including four new species
    authors: C.-W. Lin, T.-C. Hsu, T.-Y. A. Yang et al.
    journal: Taiwania
    citation: "66(4): 478–495"
    year: 2021
    doi: 10.6165/tai.2021.66.478
    abstract: >-
      The Solomon Islands in Melanesian region of South Pacific lie in an equatorial climate and
      harbour diverse habitats covered by forests. Based on field surveys and specimens examination,
      six <i>Begonia</i> species were confirmed from the Solomon Islands, and a key of the species is
      provided for identification. [Rest of the abstract from the journal page]
  - title: >-
      <i>Gastrodia isabelensis</i> and <i>G. solomonensis</i> (Gastrodieae, Epidendroideae, Orchidaceae):
      two new species representing a new generic record in the Solomon Islands
    authors: T.-C. Hsu, M. Fanerii, T.-Y. A. Yang et al.
    journal: Phytotaxa
    citation: "270(2): 137–145"
    year: 2016
    doi: 10.11646/phytotaxa.270.2.6
    abstract: >-
      Two new mycoheterotrophic orchids, <i>Gastrodia isabelensis</i> and <i>G. solomonensis</i>, are
      described and illustrated from the Solomon Islands. The genus <i>Gastrodia</i> is also recorded
      in the country for the first time. [Rest of the abstract from the journal page]
  - title: New Records and Name Changes for the Orchids in the Solomon Islands
    authors: T.-C. Hsu, T.-Y. A. Yang, F. Pitisopa et al.
    journal: Taiwania
    citation: "61(1): 21–26"
    year: 2016
    doi: 10.6165/tai.2016.61.21
    abstract: >-
      One genus (<i>Anoectochilus</i>) and 12 species (<i>Agrostophyllum neoguineense</i>,
      <i>Anoectochilus papuanus</i>, <i>Arundina graminifolia</i>, <i>Bulbophyllum aemulum</i>,
      <i>B. bisepalum</i>, <i>B. nubigenum</i>, <i>B. ochroleucum</i>, <i>B. phreatiopse</i>,
      <i>Corybas solomonensis</i>, <i>Crepidium laevis</i>, <i>Didymoplexis striata</i>,
      <i>Epipogium roseum</i>) of orchids (Orchidaceae) are first recorded to the flora of the
      Solomon Islands during the 2012–2015 field expeditions. Geographic data, ecological and
      taxonomic notes and illustrations of those species are provided. A new combination
      (<i>Pinalia oligotricha</i>) and a new name (<i>Dendrobium bougainvilleanum</i>) are also
      proposed for fitting recent systematic alterations within Orchidaceae.
  - title: >-
      <i>Antrophyum solomonense</i> (Pteridaceae), a New Species from the Solomon Islands, and Its
      Systematic Position Based on Phylogenetic Analysis
    authors: C.-W. Chen, J. H. Nitta, M. Fanerii et al.
    journal: Systematic Botany
    citation: "40(3): 645–651"
    year: 2015
    doi: 10.1600/036364415X689357
    abstract: >-
      [Full abstract from the journal page. It opens: "A vittarioid fern from the Solomon Islands,
      which has long been treated as Antrophyum semicostatum, is described here as a new …"]

